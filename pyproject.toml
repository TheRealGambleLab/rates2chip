[project]
name = "rates2chip"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
	{name = "Joshua Saltzberg", email = "joshua.saltzberg@einsteinmed.edu"},
]
dependencies = [
	"numpy>=1.24.3",
	"pandas>=1.5.2",
	"scipy>=1.9.3",
	"scikit-learn>=1.7.0",
	"seaborn>=0.13.2",
	"pysam>=0.22.1",
	"pybigwig>=0.3.22",
	"pyarrow>=16.0.0"
]
requires-python = ">=3.10.8"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false